[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-em"
version = "0.1.0"
description = "A Slack bot that helps people reach the smallest useful audience."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # aiohttp is also the transport Slack's Socket Mode adapter uses; the
    # health server reuses it so the Render keep-alive needs no extra web
    # framework (FastAPI/uvicorn were dropped with the rejected HTTP mode).
    "aiohttp>=3.10,<4",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "slack-cli-hooks<1.0.0",
    "slack-bolt>=1.21,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
