display_information:
  name: Reach'em
  description: Reach the smallest useful audience when a teammate is unavailable.
  background_color: "#1d1c1d"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Reach
    always_online: false
  slash_commands:
    - command: /reach
      description: Ask Reach for help in its direct-message conversation.
      usage_hint: natural-language request
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:history

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - message.im
  token_rotation_enabled: false
